<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU-Share - Plateforme de Minage Distribué</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#070a11] text-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Cpu = ({ className }) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>;
        const Download = ({ className }) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const LogOut = ({ className }) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
        const ShieldAlert = ({ className }) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const MessageSquare = ({ className }) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;

        const SERVER_API_URL = "https://serveur-gpu.onrender.com/api";
        const SERVER_WS_URL = "wss://serveur-gpu.onrender.com/ws/worker/";

        // Base de données complète des cartes graphiques avec puissance et gains estimés
        const GPU_DATABASE = [
          { name: 'NVIDIA RTX 4090', hashrate: 135, power: 320, estDailyEarning: 4.85 },
          { name: 'NVIDIA RTX 4080', hashrate: 98, power: 240, estDailyEarning: 3.40 },
          { name: 'NVIDIA RTX 4070 Ti', hashrate: 78, power: 200, estDailyEarning: 2.70 },
          { name: 'NVIDIA RTX 4070', hashrate: 65, power: 180, estDailyEarning: 2.25 },
          { name: 'NVIDIA RTX 4060 Ti', hashrate: 45, power: 140, estDailyEarning: 1.60 },
          { name: 'NVIDIA RTX 3090', hashrate: 110, power: 300, estDailyEarning: 3.90 },
          { name: 'NVIDIA RTX 3080 Ti', hashrate: 100, power: 290, estDailyEarning: 3.50 },
          { name: 'NVIDIA RTX 3080', hashrate: 95, power: 250, estDailyEarning: 3.20 },
          { name: 'NVIDIA RTX 3070', hashrate: 62, power: 130, estDailyEarning: 2.15 },
          { name: 'NVIDIA RTX 3060 Ti', hashrate: 58, power: 120, estDailyEarning: 1.95 },
          { name: 'NVIDIA RTX 3060', hashrate: 42, power: 110, estDailyEarning: 1.45 },
          { name: 'NVIDIA RTX 2080 Ti', hashrate: 55, power: 250, estDailyEarning: 1.80 },
          { name: 'NVIDIA RTX 2070', hashrate: 38, power: 175, estDailyEarning: 1.25 },
          { name: 'AMD RX 7900 XTX', hashrate: 92, power: 270, estDailyEarning: 3.10 },
          { name: 'AMD RX 7900 XT', hashrate: 82, power: 240, estDailyEarning: 2.80 },
          { name: 'AMD RX 6800 XT', hashrate: 64, power: 150, estDailyEarning: 2.05 },
          { name: 'AMD RX 6700 XT', hashrate: 46, power: 130, estDailyEarning: 1.50 }
        ];

        function App() {
          const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('gpu_logged') === 'true');
          const [userEmail, setUserEmail] = useState(() => localStorage.getItem('gpu_email') || '');
          const [userApiKey, setUserApiKey] = useState(() => localStorage.getItem('gpu_apikey') || '');

          const [activeTab, setActiveTab] = useState('home');
          const [showAuthModal, setShowAuthModal] = useState(false);
          const [authMode, setAuthMode] = useState('login');

          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [country, setCountry] = useState('FR');
          const [authError, setAuthError] = useState('');
          
          // Nombre total de comptes créés récupéré depuis le serveur
          const [totalAccountsCount, setTotalAccountsCount] = useState(0);

          const [chatBannedUntil, setChatBannedUntil] = useState(null);
          const [chatWarning, setChatWarning] = useState('');

          // Calculateur (avec kWh France par défaut à 0.25€)
          const [selectedGPU, setSelectedGPU] = useState(GPU_DATABASE[0]);
          const [elecCost, setElecCost] = useState(0.25);

          const [isWorkerConnected, setIsWorkerConnected] = useState(false);
          const [balance, setBalance] = useState(0.00);
          const [currentHashrate, setCurrentHashrate] = useState(0);
          const [currentTemp, setCurrentTemp] = useState(0); 
          const [currentPower, setCurrentPower] = useState(0); 
          const [fanSpeed, setFanSpeed] = useState(0);
          const [connectedGpuName, setConnectedGpuName] = useState('Aucun GPU connecté');

          const [cryptoWallets, setCryptoWallets] = useState({ BTC: '', ETH: '', BNB: '' });
          const [selectedPayoutCrypto, setSelectedPayoutCrypto] = useState('BTC');
          const [withdrawalAmount, setWithdrawalAmount] = useState('');

          const [chatChannel, setChatChannel] = useState('FR');
          const [chatMessages, setChatMessages] = useState([
            { id: 1, user: "System", text: "Bienvenue sur le chat communautaire GPU-Share !", time: "12:00", channel: "FR" },
            { id: 2, user: "System", text: "Welcome to the global GPU-Share community chat!", time: "12:00", channel: "EN" }
          ]);
          const [newMessage, setNewMessage] = useState('');
          const chatEndRef = useRef(null);

          // Récupérer le nombre de comptes créés depuis le serveur
          useEffect(() => {
            fetch(`${SERVER_API_URL}/stats`)
              .then(res => res.json())
              .then(data => {
                if (data && data.active_users !== undefined) {
                  setTotalAccountsCount(data.active_users);
                }
              })
              .catch(() => {});
          }, []);

          const handleLoginSuccess = (emailVal, apiKeyVal, balanceVal) => {
            setIsLoggedIn(true);
            setUserEmail(emailVal);
            setUserApiKey(apiKeyVal);
            if (balanceVal !== undefined) setBalance(balanceVal);

            localStorage.setItem('gpu_logged', 'true');
            localStorage.setItem('gpu_email', emailVal);
            localStorage.setItem('gpu_apikey', apiKeyVal);
          };

          const handleLogout = () => {
            setIsLoggedIn(false);
            setUserEmail('');
            setUserApiKey('');
            localStorage.removeItem('gpu_logged');
            localStorage.removeItem('gpu_email');
            localStorage.removeItem('gpu_apikey');
            setActiveTab('home');
          };

          const handleAuthSubmit = async (e) => {
            e.preventDefault();
            setAuthError('');
            const endpoint = authMode === 'login' ? '/login' : '/register';
            
            try {
              const response = await fetch(`${SERVER_API_URL}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, country: authMode === 'register' ? country : undefined })
              });

              const data = await response.json();

              if (response.ok) {
                setShowAuthModal(false);
                handleLoginSuccess(email, data.api_key, data.balance);
                setTotalAccountsCount(prev => prev + 1);
                setActiveTab('dashboard');
              } else {
                setAuthError(data.detail || "Erreur d'authentification.");
              }
            } catch (err) {
              setAuthError("Impossible de contacter le serveur Render.");
            }
          };

          useEffect(() => {
            if (isLoggedIn && userApiKey) {
              let ws;
              try {
                ws = new WebSocket(`${SERVER_WS_URL}${userApiKey}`);
                ws.onopen = () => setIsWorkerConnected(true);
                ws.onmessage = (event) => {
                  const data = JSON.parse(event.data);
                  if (data) {
                    setIsWorkerConnected(true);
                    setConnectedGpuName(data.gpu_name || 'NVIDIA GPU');
                    setCurrentTemp(data.temperature || 0);
                    setCurrentPower(data.power || 0);
                    setFanSpeed(data.fan_speed || 0);
                    setCurrentHashrate(data.hashrate || 0);
                    if (data.balance !== undefined) setBalance(data.balance);
                  }
                };
                ws.onclose = () => setIsWorkerConnected(false);
              } catch (e) {
                setIsWorkerConnected(false);
              }
              return () => { if (ws) ws.close(); };
            }
          }, [isLoggedIn, userApiKey]);

          const handleWithdrawalSubmit = async (e) => {
            e.preventDefault();
            const amount = parseFloat(withdrawalAmount);
            if (!cryptoWallets[selectedPayoutCrypto]) {
              alert(`Veuillez entrer une adresse ${selectedPayoutCrypto}.`);
              return;
            }
            if (isNaN(amount) || amount < 10) {
              alert("Montant minimum : 10.00 €.");
              return;
            }
            try {
              const response = await fetch(`${SERVER_API_URL}/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, amount, crypto: selectedPayoutCrypto, wallet: cryptoWallets[selectedPayoutCrypto] })
              });
              if (response.ok) {
                setBalance(prev => prev - amount);
                setWithdrawalAmount('');
                alert(`Demande de retrait enregistrée avec succès !`);
              } else {
                const data = await response.json();
                alert(data.detail || "Erreur lors de la demande de retrait.");
              }
            } catch (e) {
              alert("Erreur de communication avec le serveur.");
            }
          };

          const handleSendMessage = (e) => {
            e.preventDefault();
            if (!newMessage.trim()) return;

            if (chatBannedUntil && Date.now() < chatBannedUntil) {
              alert("Vous êtes banni du chat pour 24h suite à une infraction.");
              return;
            }

            const textLower = newMessage.toLowerCase();
            const forbiddenWords = ["suicide", "tuer", "mort", "meurtre", "connard", "connasse", "pute", "salope", "fdp", "nique", "enculé", "hack", "violer", "raciste", "sexiste", "nazi"];
            const isViolating = forbiddenWords.some(word => textLower.includes(word));

            if (isViolating) {
              const banTime = Date.now() + (24 * 60 * 60 * 1000);
              setChatBannedUntil(banTime);
              setChatWarning("⚠️ Infraction détectée ! Votre compte a été banni du chat pour 24 heures.");
              setNewMessage('');
              return;
            }

            const msg = {
              id: Date.now(),
              user: userEmail ? userEmail.split('@')[0] : 'Anonyme',
              text: newMessage,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              channel: chatChannel
            };
            setChatMessages(prev => [...prev, msg]);
            setNewMessage('');
          };

          useEffect(() => {
            chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [chatMessages]);

          // Calculs financiers (Brut - Électricité France - 2% de frais de contribution plateforme)
          const dailyGross = selectedGPU.estDailyEarning;
          const dailyKwh = (selectedGPU.power * 24) / 1000;
          const dailyElecCost = dailyKwh * elecCost;
          const dailyNetBeforeFee = Math.max(0, dailyGross - dailyElecCost);
          const platformFee = dailyNetBeforeFee * 0.02; // Frais de contribution 2%
          const dailyNet = dailyNetBeforeFee - platformFee;
          const monthlyNet = dailyNet * 30;

          return (
            <div className="min-h-screen bg-[#070a11] text-slate-100 font-sans flex flex-col">
              <header className="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
                <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                  <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                    <div className="bg-blue-600 p-2 rounded-xl text-white">
                      <Cpu className="h-5 w-5" />
                    </div>
                    <span className="font-bold text-xl text-white tracking-wide">GPU-Share</span>
                  </div>

                  <nav className="hidden lg:flex space-x-1 bg-slate-950/60 p-1 rounded-2xl border border-slate-800">
                    <button onClick={() => setActiveTab('home')} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${activeTab === 'home' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Accueil</button>
                    <button onClick={() => setActiveTab('calculator')} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${activeTab === 'calculator' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Calculateur Pro</button>
                    <button onClick={() => setActiveTab('download')} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${activeTab === 'download' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Télécharger (.exe)</button>
                    <button onClick={() => setActiveTab('chat')} className={`px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1 transition ${activeTab === 'chat' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}><MessageSquare className="w-3.5 h-3.5" /> Communauté</button>
                    {isLoggedIn && (
                      <>
                        <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Mon GPU</button>
                        <button onClick={() => setActiveTab('payouts')} className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${activeTab === 'payouts' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Retraits</button>
                      </>
                    )}
                  </nav>

                  <div className="flex items-center gap-3">
                    <div className="hidden sm:flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span className="text-slate-300 font-semibold">{totalAccountsCount} comptes créés</span>
                    </div>
                    {isLoggedIn ? (
                      <button onClick={handleLogout} className="p-2 text-slate-400 hover:text-rose-400 flex items-center gap-1 text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 transition" title="Déconnexion"><LogOut className="w-4 h-4" /> <span className="hidden sm:inline">Déconnexion</span></button>
                    ) : (
                      <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">Connexion</button>
                    )}
                  </div>
                </div>
              </header>

              <main className="flex-1 max-w-5xl mx-auto w-full p-6 space-y-8">
                {activeTab === 'home' && (
                  <div className="py-8 space-y-12">
                    {/* Bannière Principale */}
                    <div className="text-center space-y-6 bg-gradient-to-b from-blue-950/50 via-slate-900/60 to-slate-900/80 border border-slate-800 p-8 md:p-14 rounded-3xl shadow-2xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 -mt-12 -mr-12 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
                      <span className="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs px-3.5 py-1.5 rounded-full font-semibold uppercase tracking-wider">⚡ Plateforme de Minage Distribué v2.5</span>
                      <h1 className="text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight">Monétisez la puissance inutilisée de votre GPU</h1>
                      <p className="text-slate-300 text-sm md:text-base max-w-2xl mx-auto leading-relaxed">Rejoignez notre réseau décentralisé sécurisé. Connectez votre carte graphique via notre application Windows, suivez vos performances en direct et touchez des revenus réguliers.</p>
                      
                      <div className="flex flex-wrap justify-center gap-4 pt-4">
                        <button onClick={() => setActiveTab('download')} className="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-xl shadow-blue-600/30 transition flex items-center gap-2">
                          <Download className="w-5 h-5" />
                          <span>Télécharger le Client (.exe)</span>
                        </button>
                        <a href="https://discord.gg/votre-invite-discord" target="_blank" rel="noopener noreferrer" className="px-8 py-4 bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold rounded-2xl shadow-xl shadow-[#5865F2]/20 transition flex items-center gap-2">
                          <span>Rejoindre notre Discord</span>
                        </a>
                      </div>
                    </div>

                    {/* Grille de Détails / Avantages */}
                    <div className="grid md:grid-cols-3 gap-6">
                      <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl space-y-3 hover:border-slate-700 transition">
                        <div className="w-10 h-10 bg-blue-600/20 text-blue-400 rounded-xl flex items-center justify-center font-bold text-lg">📈</div>
                        <h3 className="text-white font-bold text-base">Comptes & Communauté</h3>
                        <p className="text-slate-400 text-xs leading-relaxed">Déjà <strong className="text-white">{totalAccountsCount} membres</strong> inscrits sur la plateforme. Partagez vos astuces sur nos chats régionaux.</p>
                      </div>
                      <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl space-y-3 hover:border-slate-700 transition">
                        <div className="w-10 h-10 bg-emerald-600/20 text-emerald-400 rounded-xl flex items-center justify-center font-bold text-lg">🛡️</div>
                        <h3 className="text-white font-bold text-base">Sécurité Matérielle</h3>
                        <p className="text-slate-400 text-xs leading-relaxed">Protection thermique intégrée : l'application régule automatiquement la charge pour préserver la durée de vie de votre GPU.</p>
                      </div>
                      <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl space-y-3 hover:border-slate-700 transition">
                        <div className="w-10 h-10 bg-purple-600/20 text-purple-400 rounded-xl flex items-center justify-center font-bold text-lg">💎</div>
                        <h3 className="text-white font-bold text-base">Paiements Flexibles</h3>
                        <p className="text-slate-400 text-xs leading-relaxed">Retirez vos gains dès 10€ accumulés directement vers votre portefeuille en Bitcoin (BTC), Ethereum (ETH) ou BNB.</p>
                      </div>
                    </div>

                    {/* Section FAQ / Informations complémentaires pour remplir le site */}
                    <div className="bg-slate-900/60 border border-slate-800 p-8 rounded-3xl space-y-6">
                      <h3 className="text-xl font-bold text-white text-center">Foire Aux Questions (FAQ)</h3>
                      <div className="grid md:grid-cols-2 gap-6 text-xs text-slate-300">
                        <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800/80 space-y-2">
                          <h4 className="font-bold text-white text-sm">Comment débuter le minage ?</h4>
                          <p className="leading-relaxed">Téléchargez l'application `.exe`, créez votre compte sur le site web, puis entrez vos identifiants dans l'application pour lier votre GPU en temps réel.</p>
                        </div>
                        <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800/80 space-y-2">
                          <h4 className="font-bold text-white text-sm">Quels sont les frais de la plateforme ?</h4>
                          <p className="leading-relaxed">GPU-Share prélève une contribution transparente de <strong>2%</strong> sur les gains nets après déduction des coûts d'électricité pour assurer la maintenance des serveurs.</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'calculator' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="text-center space-y-2">
                      <h2 className="text-2xl font-bold text-white">Calculateur de Rentabilité Pro</h2>
                      <p className="text-xs text-slate-400">Estimez vos gains précis en tenant compte du coût de l'électricité en France et de la contribution de 2%.</p>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl space-y-6 shadow-2xl">
                      <div className="grid md:grid-cols-2 gap-6">
                        <div>
                          <label className="text-xs text-slate-400 block mb-2 font-semibold">Sélectionnez votre GPU</label>
                          <select onChange={(e) => setSelectedGPU(GPU_DATABASE.find(g => g.name === e.target.value))} className="w-full bg-slate-950 text-white p-3.5 rounded-xl border border-slate-800 text-sm focus:outline-none focus:border-blue-500">
                            {GPU_DATABASE.map(g => <option key={g.name} value={g.name}>{g.name} ({g.hashrate} MH/s)</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-xs text-slate-400 block mb-2 font-semibold">Coût de l'électricité (€ / kWh)</label>
                          <input type="number" step="0.01" value={elecCost} onChange={(e) => setElecCost(parseFloat(e.target.value) || 0)} className="w-full bg-slate-950 text-white p-3.5 rounded-xl border border-slate-800 text-sm focus:outline-none focus:border-blue-500" />
                          <span className="text-[10px] text-slate-500 mt-1 block">Moyenne France estimée : ~0.25 € / kWh</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 md:grid-cols-3 gap-4 pt-4 border-t border-slate-800">
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                          <div className="text-xs text-slate-400">Consommation</div>
                          <div className="text-lg font-bold text-white mt-1">{selectedGPU.power} W</div>
                        </div>
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                          <div className="text-xs text-slate-400">Coût électricité /jour</div>
                          <div className="text-lg font-bold text-rose-400 mt-1">€{dailyElecCost.toFixed(2)}</div>
                        </div>
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 col-span-2 md:col-span-1">
                          <div className="text-xs text-slate-400">Frais plateforme (2%)</div>
                          <div className="text-lg font-bold text-amber-400 mt-1">€{platformFee.toFixed(2)} /j</div>
                        </div>
                      </div>

                      <div className="bg-gradient-to-r from-blue-950/60 to-slate-950 p-6 rounded-2xl border border-blue-900/50 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                          <div className="text-xs font-bold text-blue-400 uppercase tracking-wider">Bénéfice Net Estimé</div>
                          <div className="text-xs text-slate-400 mt-0.5">Après électricité et frais de contribution (2%)</div>
                        </div>
                        <div className="text-right">
                          <div className="text-3xl font-extrabold text-emerald-400">€{monthlyNet.toFixed(2)} <span className="text-xs text-slate-400 font-normal">/ mois</span></div>
                          <div className="text-xs text-blue-300 font-medium"> (€{dailyNet.toFixed(2)} / jour)</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'download' && (
                  <div className="space-y-6 max-w-xl mx-auto">
                    <div className="text-center py-12 bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl">
                      <Download className="w-16 h-16 text-blue-400 mx-auto" />
                      <div className="space-y-2">
                        <h2 className="text-2xl font-bold text-white">Application Client Windows (.exe)</h2>
                        <p className="text-xs text-slate-400 max-w-sm mx-auto">Téléchargez le fichier d'installation officiel et connectez votre GPU en 1 clic avec votre clé API.</p>
                      </div>
                      <a href="https://raw.githubusercontent.com/pluton89/gpu-miner-releases/e04d7619d87e160543e113238f45f831d1c0d3c2/GPU-Share-Miner.exe" download className="inline-block px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-lg shadow-blue-600/30 transition">Télécharger Setup-GPU-Share-Miner.exe</a>
                    </div>

                    <div className="bg-amber-950/20 border border-amber-800/50 p-5 rounded-2xl flex gap-4 items-start">
                      <ShieldAlert className="w-6 h-6 text-amber-400 flex-shrink-0 mt-0.5" />
                      <div className="space-y-1">
                        <h4 className="text-amber-300 font-bold text-sm">Note concernant Windows Defender</h4>
                        <p className="text-xs text-slate-300 leading-relaxed">
                          Les logiciels de minage déclenchent parfois un faux positif antivirus. Cliquez sur <em>"Informations complémentaires"</em> puis <em>"Exécuter quand même"</em> pour lancer l'application en toute sécurité.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'chat' && (
                  <div className="space-y-4 max-w-4xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                      <div>
                        <h2 className="text-lg font-bold text-white">💬 Chat Communautaire Global</h2>
                        <p className="text-xs text-slate-400">Discutez en direct avec les autres membres par région. Modération automatique active (Ban 24h en cas d'insultes).</p>
                      </div>
                      <div className="flex gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onClick={() => setChatChannel('FR')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${chatChannel === 'FR' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>🇫🇷 Français</button>
                        <button onClick={() => setChatChannel('EN')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${chatChannel === 'EN' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>🇬🇧 English</button>
                      </div>
                    </div>

                    {chatWarning && (
                      <div className="bg-rose-950/40 border border-rose-800 p-3 rounded-xl text-rose-300 text-xs text-center font-bold">
                        {chatWarning}
                      </div>
                    )}

                    <div className="bg-slate-900 border border-slate-800 rounded-3xl h-[450px] flex flex-col overflow-hidden shadow-2xl">
                      <div className="flex-1 p-4 overflow-y-auto space-y-3">
                        {chatMessages.filter(m => m.channel === chatChannel).map(msg => (
                          <div key={msg.id} className="bg-slate-950/70 border border-slate-800/60 p-3.5 rounded-2xl space-y-1 max-w-lg shadow">
                            <div className="flex justify-between items-center">
                              <span className="text-xs font-bold text-blue-400">{msg.user}</span>
                              <span className="text-[10px] text-slate-500">{msg.time}</span>
                            </div>
                            <p className="text-xs text-slate-200 leading-relaxed">{msg.text}</p>
                          </div>
                        ))}
                        <div ref={chatEndRef} />
                      </div>

                      <form onSubmit={handleSendMessage} className="p-4 bg-slate-950 border-t border-slate-800 flex gap-3">
                        <input 
                          type="text" 
                          placeholder={!isLoggedIn ? "Connectez-vous pour participer au chat..." : `Écrire un message dans #${chatChannel}...`} 
                          disabled={!isLoggedIn || (chatBannedUntil && Date.now() < chatBannedUntil)} 
                          value={newMessage} 
                          onChange={(e) => setNewMessage(e.target.value)} 
                          className="flex-1 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-blue-500 disabled:opacity-50" 
                        />
                        <button type="submit" disabled={!isLoggedIn || (chatBannedUntil && Date.now() < chatBannedUntil)} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-blue-600/20">Envoyer</button>
                      </form>
                    </div>
                  </div>
                )}

                {activeTab === 'dashboard' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex justify-between items-center shadow-xl">
                      <div>
                        <h2 className="text-xl font-bold text-white">Statut du GPU</h2>
                        <div className="text-xs text-emerald-400 mt-1 font-semibold">{isWorkerConnected ? `● En ligne (${connectedGpuName})` : '○ Hors ligne (Lancez votre .exe)'}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-xs text-slate-400">Solde Actuel ({userEmail})</div>
                        <div className="text-3xl font-extrabold text-blue-400 mt-1">€{balance.toFixed(2)}</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow"><div className="text-xs text-slate-400">Hashrate</div><div className="text-xl font-extrabold text-white mt-1">{currentHashrate} MH/s</div></div>
                      <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow"><div className="text-xs text-slate-400">Température</div><div className="text-xl font-extrabold text-white mt-1">{currentTemp}°C</div></div>
                      <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow"><div className="text-xs text-slate-400">Puissance</div><div className="text-xl font-extrabold text-white mt-1">{currentPower} W</div></div>
                      <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow"><div className="text-xs text-slate-400">Ventilateur</div><div className="text-xl font-extrabold text-white mt-1">{fanSpeed}%</div></div>
                    </div>
                  </div>
                )}

                {activeTab === 'payouts' && (
                  <div className="space-y-6 max-w-md mx-auto">
                    <div className="text-center space-y-1">
                      <h2 className="text-2xl font-bold text-white">Demande de Retrait</h2>
                      <p className="text-xs text-slate-400">Seuil minimum : 10.00 €</p>
                    </div>
                    <form onSubmit={handleWithdrawalSubmit} className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl space-y-4 shadow-2xl">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1 font-semibold">Crypto-monnaie</label>
                        <select value={selectedPayoutCrypto} onChange={(e) => setSelectedPayoutCrypto(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl text-white border border-slate-800 text-sm">
                          <option value="BTC">Bitcoin (BTC)</option>
                          <option value="ETH">Ethereum (ETH)</option>
                          <option value="BNB">Binance Coin (BNB)</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1 font-semibold">Montant (€)</label>
                        <input type="number" step="0.01" min="10" placeholder="Minimum 10.00 €" value={withdrawalAmount} onChange={(e) => setWithdrawalAmount(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl text-white border border-slate-800 text-sm" />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1 font-semibold">Adresse de portefeuille {selectedPayoutCrypto}</label>
                        <input type="text" placeholder={`Votre adresse ${selectedPayoutCrypto}`} value={cryptoWallets[selectedPayoutCrypto]} onChange={(e) => setCryptoWallets({ ...cryptoWallets, [selectedPayoutCrypto]: e.target.value })} className="w-full bg-slate-950 p-3.5 rounded-xl text-white border border-slate-800 text-sm" />
                      </div>
                      <button type="submit" className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition text-sm">Confirmer le retrait</button>
                    </form>
                  </div>
                )}
              </main>

              {showAuthModal && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-slate-900 p-8 rounded-3xl max-w-sm w-full space-y-5 border border-slate-800 shadow-2xl">
                    <div className="flex justify-between items-center">
                      <h3 className="text-xl font-bold text-white">{authMode === 'login' ? 'Connexion' : 'Créer un compte'}</h3>
                      <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                    </div>
                    {authError && <div className="text-xs text-rose-400 bg-rose-950/40 p-3 rounded-xl border border-rose-800">{authError}</div>}
                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Email</label>
                        <input type="email" placeholder="votre@email.com" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl text-white border border-slate-800 text-sm focus:outline-none focus:border-blue-500" required />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Mot de passe</label>
                        <input type="password" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl text-white border border-slate-800 text-sm focus:outline-none focus:border-blue-500" required />
                      </div>
                      
                      {authMode === 'register' && (
                        <div>
                          <label className="text-xs text-slate-400 block mb-1">Votre pays / Région</label>
                          <select value={country} onChange={(e) => setCountry(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl text-white border border-slate-800 text-sm">
                            <option value="FR">🇫🇷 France / Francophone</option>
                            <option value="EN">🇬🇧 English / International</option>
                          </select>
                        </div>
                      )}

                      <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-600/30 transition">{authMode === 'login' ? 'Se connecter' : "S'inscrire"}</button>
                    </form>
                    <div className="text-center pt-2">
                      <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-xs text-blue-400 hover:underline">
                        {authMode === 'login' ? "Pas de compte ? S'inscrire" : "Déjà un compte ? Se connecter"}
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
